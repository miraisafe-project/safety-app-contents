<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80baca" stop-opacity="0"/>
      <stop offset=".12" stop-color="#80baca" stop-opacity=".85"/>
      <stop offset=".88" stop-color="#80baca" stop-opacity=".85"/>
      <stop offset="1" stop-color="#80baca" stop-opacity="0"/>
